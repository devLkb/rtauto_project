behaviors:
  DG5FPicknPlace:
    trainer_type: ppo
    hyperparameters:
      # 40 parallel training areas x ~200 decisions per episode (20 s episodes at
      # a 0.1 s decision period). Area count and batch/buffer doubled from
      # dg5f_grasp_lift.yaml's 20/2048/20480 (2026-08-27): a 20-area run left the
      # GPU at ~17% utilization (environment throughput was the bottleneck, not
      # the PPO update), so both were scaled up together to use the RTX 2080
      # headroom without changing the update's relative shape (buffer:batch
      # ratio, epochs) from the proven GraspLift config.
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # The lift payoff arrives up to ~10 s after the grasp that earned it, so
        # the discount horizon has to be long (same as GraspLift).
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 5000
    threaded: false

torch_settings:
  # Must be cuda on a GPU machine — see dg5f_grasp_lift.yaml's identical comment
  # (this ml-agents dev build cannot fall back to cpu once cuda has been set as
  # the process-wide default device).
  device: cuda

environment_parameters:
  # Thumb-down constraint, rebalanced (2026-08-28). Dg5fPicknPlaceSpec's code
  # default is -0.10 per decision. That default was never checked against the
  # episode's reward budget: DecisionRequester.DecisionPeriod is 5 (0.1 s) and
  # EpisodeTimeoutSeconds is 20, so an episode is ~200 decisions and a fully
  # thumb-down posture costs up to -0.10 * 200 = -20.0 — against a maximum
  # attainable positive total of about +12.2 (approach 2.5 + top-down 0.3 +
  # closure 1.0 + contact 0.4 + grasp 1.0 + lift potential 2.0 + success 5.0).
  # A shaping term that can outweigh every reward in the task combined does not
  # shape the posture, it makes standing still (and, worse, self-terminating on
  # the -2.0 safety penalties) the profitable policy — which is exactly the
  # "converged to near-zero movement, ContactCount flat over 2M+ steps" symptom
  # recorded in Dg5fPicknPlaceAgent's 2026-08-27 diagnostic comment.
  # -0.01 caps the term at -2.0 per episode: same order as the terminal safety
  # penalties, still a real cost, no longer able to dominate the task reward.
  # The constraint itself is unchanged (still on by default, same 60 deg
  # threshold) — only its weight. The code default is deliberately left alone so
  # this stays a sweepable knob rather than a second hardcoded constant.
  thumb_down_penalty_scale: -0.01

  # Grasp curriculum: spawn annulus + lift target/hold, identical shape to
  # GraspLift's grasp_stage (reused verbatim — same cube geometry).
  grasp_stage:
    curriculum:
      - name: lift_5cm_near
        completion_criteria:
          measure: progress
          behavior: DG5FPicknPlace
          threshold: 0.25
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 1.0
      - name: lift_8cm
        completion_criteria:
          measure: progress
          behavior: DG5FPicknPlace
          threshold: 0.55
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 2.0
      - name: lift_10cm_target
        value:
          sampler_type: constant
          sampler_parameters:
            value: 3.0
