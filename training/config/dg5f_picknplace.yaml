behaviors:
  DG5FPicknPlace:
    trainer_type: ppo
    hyperparameters:
      # 40 parallel training areas x ~200 decisions per episode (20 s episodes at
      # a 0.1 s decision period). Area count and batch/buffer doubled from
      # dg5f_grasp_lift.yaml's 20/2048/20480 (2026-08-27): a 20-area run left the
      # GPU at ~17% utilization (environment throughput was the bottleneck, not
      # the PPO update), so both were scaled up together to use the RTX 2080
      # headroom without changing the update's relative shape (buffer:batch
      # ratio, epochs) from the proven GraspLift config.
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # The lift payoff arrives up to ~10 s after the grasp that earned it, so
        # the discount horizon has to be long (same as GraspLift).
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 5000
    threaded: false

torch_settings:
  # Must be cuda on a GPU machine — see dg5f_grasp_lift.yaml's identical comment
  # (this ml-agents dev build cannot fall back to cpu once cuda has been set as
  # the process-wide default device).
  device: cuda

environment_parameters:
  # Grasp curriculum: spawn annulus + lift target/hold, identical shape to
  # GraspLift's grasp_stage (reused verbatim — same cube geometry).
  grasp_stage:
    curriculum:
      - name: lift_5cm_near
        completion_criteria:
          measure: progress
          behavior: DG5FPicknPlace
          threshold: 0.25
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 1.0
      - name: lift_8cm
        completion_criteria:
          measure: progress
          behavior: DG5FPicknPlace
          threshold: 0.55
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 2.0
      - name: lift_10cm_target
        value:
          sampler_type: constant
          sampler_parameters:
            value: 3.0
