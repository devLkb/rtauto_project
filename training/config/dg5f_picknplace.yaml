behaviors:
  DG5FPicknPlace:
    trainer_type: ppo
    hyperparameters:
      # 40 parallel training areas x ~200 decisions per episode (20 s episodes at
      # a 0.1 s decision period). Area count and batch/buffer doubled from
      # dg5f_grasp_lift.yaml's 20/2048/20480 (2026-08-27): a 20-area run left the
      # GPU at ~17% utilization (environment throughput was the bottleneck, not
      # the PPO update), so both were scaled up together to use the GPU headroom
      # without changing the update's relative shape (buffer:batch ratio, epochs)
      # from the proven GraspLift config.
      #
      # 2026-08-30, training host is now an RTX 4070 Ti / 32 GB / Ryzen 7 7800X3D
      # (8C16T) Windows desktop: the same environment-throughput bottleneck is now
      # attacked with mlagents-learn --num-envs (10 headless player processes x 40
      # areas = 400 agents) rather than by growing the update again. 10 is measured,
      # not guessed: 300k-step runs gave 1643 / 1932 / 2206 / 2390 / 2266 steps/s at
      # 4 / 6 / 8 / 10 / 12 envs, so throughput turns over just past 10 as the
      # players start contending with the trainer for 8 physical cores. Deliberately
      # NOT rescaling batch/buffer with the agent count: the proven update shape
      # (buffer:batch ratio, epochs, horizon) survives untouched and only the
      # wall-clock cost of filling the buffer drops -- 20M steps lands near 2.5 h.
      # See training/scripts/train_picknplace.py and .env.
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # The lift payoff arrives up to ~10 s after the grasp that earned it, so
        # the discount horizon has to be long (same as GraspLift).
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 200000
    # Raised from 5M with the ~4x throughput of the 4-player headless setup
    # (2026-08-30). 5M steps at buffer_size 40960 is only ~122 PPO updates, which
    # was already thin for a grasp curriculum; 20M brings it to ~488 while still
    # being hours, not days, of wall clock on this host.
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 5000
    threaded: false

torch_settings:
  # Must be cuda on a GPU machine — see dg5f_grasp_lift.yaml's identical comment
  # (this ml-agents dev build cannot fall back to cpu once cuda has been set as
  # the process-wide default device).
  device: cuda

environment_parameters:
  # Thumb posture requirement (task brief): the thumb must never be the part of
  # the hand aimed at the work surface, so the grasp transfers to a later
  # pick-and-place phase where the hand has to release beside a platform.
  #
  # History, because the weight alone is not the interesting part. The original
  # reading was an ANGLE (thumb base->tip vs straight down, free above 60 deg) at
  # -0.10 per decision. On 2026-08-28 that was found to be able to outweigh the
  # whole task: ~200 decisions per episode x -0.10 = -20.0 against a maximum
  # attainable positive total near +12.2, and the run had converged to near-zero
  # movement with ContactCount flat over 2M+ steps. It was rebalanced to -0.01 as
  # a stopgap.
  #
  # On 2026-08-30 the kinematics were actually measured (Tools > ML-Agents >
  # Diagnose PicknPlace Thumb Orientation) and the reading itself turned out to be
  # wrong, not just too heavy: at one fixed arm pose that angle swung 71.5 -> 6.8
  # deg purely as grip closure went 0 -> 0.75, while the thumb's proximal segment
  # held a constant 30.0 deg. It was measuring how CLOSED the hand was. Weakening
  # it to -0.01 hid the symptom but kept a signal that penalises grasping.
  #
  # The reading is now the DEPTH of the thumb tip below the lowest other
  # fingertip -- the same concern stated so the policy can satisfy it. -0.05 is
  # sized by the rule the old value violated: a whole episode at full cost must
  # stay under one lift's payoff. See docs/DG5F_PICKNPLACE.md.
  thumb_down_penalty_scale:
    sampler_type: constant
    sampler_parameters:
      value: -0.05

  # Stable-lift requirement (2026-08-30). Nothing charged for carrying the pillar
  # cocked over: IsToppled stops applying once the grasp is confirmed and the lift
  # success test ignores attitude, so mean tilt was drifting up (27 -> 29 deg by
  # 6M steps). Graded per-decision cost while the object is held, free under
  # 10 deg. Introduced mid-run and applied with --resume, so the reward changes
  # from that step onward; the success-rate definition was deliberately left alone
  # so its curve stays comparable across the whole run. Measured effect:
  # 27.5 -> 15.3 deg with success rising 98 -> 99%.
  lift_tilt_penalty_scale:
    sampler_type: constant
    sampler_parameters:
      value: -0.02

  # Grasp curriculum: spawn annulus + lift target/hold, identical shape to
  # GraspLift's grasp_stage (reused verbatim — same cube geometry).
  grasp_stage:
    curriculum:
      - name: lift_5cm_near
        completion_criteria:
          measure: progress
          behavior: DG5FPicknPlace
          threshold: 0.25
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 1.0
      - name: lift_8cm
        completion_criteria:
          measure: progress
          behavior: DG5FPicknPlace
          threshold: 0.55
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 2.0
      - name: lift_10cm_target
        value:
          sampler_type: constant
          sampler_parameters:
            value: 3.0
