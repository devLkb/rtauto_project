behaviors:
  DG5FGraspLift:
    trainer_type: ppo
    hyperparameters:
      # 20 parallel training areas x ~200 decisions per episode. A 20480 buffer is
      # ~2 full rollouts across all areas, which keeps the grasp/lift events (rare
      # early on) from being averaged away inside a single update.
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      # normalize/hidden_units/num_layers must stay identical to the 57/7 reach
      # checkpoint or `--initialize-from` cannot load it.
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # The lift payoff arrives up to ~10 s (100 decisions) after the grasp that
        # earned it, so the discount horizon has to be long.
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 5000
    threaded: false

torch_settings:
  # GPU가 있는 머신에서는 반드시 cuda로 둘 것 — cpu로 두면 이 ml-agents dev 빌드가
  # 로드 시 걸어둔 전역 기본 디바이스(cuda)를 되돌리지 못해 cpu/cuda 텐서 불일치로
  # 죽는다(mlagents/torch_utils/torch.py set_torch_config, 2026-08-26 확인).
  device: cuda

environment_parameters:
  # Grasp curriculum. Stage 1 keeps the block inside the annulus the transferred
  # pre-grasp policy already solves and only asks for a 5 cm lift held 0.25 s;
  # stages 2-3 widen the workspace and raise the lift contract to 10 cm held 0.5 s.
  #
  # Progress (step-count) gating rather than reward gating: the reward scale changes
  # between stages, so a reward threshold would not mean the same thing in each
  # lesson.
  grasp_stage:
    curriculum:
      - name: lift_5cm_near
        completion_criteria:
          measure: progress
          behavior: DG5FGraspLift
          threshold: 0.25
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 1.0
      - name: lift_8cm
        completion_criteria:
          measure: progress
          behavior: DG5FGraspLift
          threshold: 0.55
          min_lesson_length: 1000
          signal_smoothing: true
        value:
          sampler_type: constant
          sampler_parameters:
            value: 2.0
      - name: lift_10cm_target
        value:
          sampler_type: constant
          sampler_parameters:
            value: 3.0
