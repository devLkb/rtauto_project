default_settings: null
behaviors:
  DG5FGraspLift:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    checkpoint_interval: 200000
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 20
    even_checkpoints: false
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 5000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  grasp_stage:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 9001
          value: 1.0
      name: lift_5cm_near
      completion_criteria:
        behavior: DG5FGraspLift
        measure: progress
        min_lesson_length: 1000
        signal_smoothing: true
        threshold: 0.25
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 9002
          value: 2.0
      name: lift_8cm
      completion_criteria:
        behavior: DG5FGraspLift
        measure: progress
        min_lesson_length: 1000
        signal_smoothing: true
        threshold: 0.55
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 9003
          value: 3.0
      name: lift_10cm_target
      completion_criteria: null
checkpoint_settings:
  run_id: test2
  initialize_from: null
  load_model: false
  resume: true
  force: false
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: cuda
debug: false
